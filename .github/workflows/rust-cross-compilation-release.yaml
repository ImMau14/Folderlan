name: Rust Cross-Compilation Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: stable

      - name: Ensure build script executable (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: chmod +x .github/scripts/build.sh

      - id: run_build
        name: Run build script (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ./.github/scripts/build.sh "${{ matrix.target }}" "${{ github.workspace }}"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}

      - id: run_build_win
        name: Run build script (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\.github\scripts\build.ps1 -Target "${{ matrix.target }}" -Workspace "${{ github.workspace }}"
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run_build.outputs.archive_name || steps.run_build_win.outputs.archive_name }}
          path: ${{ steps.run_build.outputs.archive_name || steps.run_build_win.outputs.archive_name }}

  create-release-assets:
    name: Create release assets
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      packages: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List downloaded files
        run: find ./artifacts -type f -maxdepth 2 -print

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/*/*.zip
          fail_on_unmatched_files: true