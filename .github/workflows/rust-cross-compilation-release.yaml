name: Rust Cross-Compilation Release

on:
  release:
    types: [published]

jobs:
  frontend-build:
    name: Build frontend and upload dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.6.0'

      - name: Install frontend deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ./frontend/dist

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    continue-on-error: false
    needs: frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Place frontend dist into backend/dist (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p backend/dist
          cp -r ./frontend-dist/* backend/dist/
        shell: bash

      - name: Place frontend dist into backend\dist (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path backend\dist -Force | Out-Null
          Copy-Item -Path .\frontend-dist\* -Destination backend\dist -Recurse -Force
        shell: pwsh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          toolchain: stable

      - name: Ensure build script executable (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: chmod +x .github/scripts/build.sh

      - id: run_build
        name: Run build script (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ./.github/scripts/build.sh "${{ matrix.target }}" "${{ github.workspace }}"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}

      - id: run_build_win
        name: Run build script (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\.github\scripts\build.ps1 -Target "${{ matrix.target }}" -Workspace "${{ github.workspace }}"
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run_build.outputs.archive_name || steps.run_build_win.outputs.archive_name }}
          path: ${{ steps.run_build.outputs.archive_name || steps.run_build_win.outputs.archive_name }}

  create-release-assets:
    name: Create release assets
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      packages: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: List downloaded files
        run: find ./artifacts -type f -maxdepth 2 -print

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*/*.zip
          fail_on_unmatched_files: true
