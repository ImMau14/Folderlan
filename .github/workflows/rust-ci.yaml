name: Rust CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/rust-ci.yaml'
      - '.github/workflows/common-rust-steps.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/rust-ci.yaml'
      - '.github/workflows/common-rust-steps.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/common-rust-steps.yaml
    with:
      command: build

  test:
    uses: ./.github/workflows/common-rust-steps.yaml
    with:
      command: test

  clippy:
    uses: ./.github/workflows/common-rust-steps.yaml
    with:
      command: "clippy -- -D warnings"

  formatting:
    uses: ./.github/workflows/common-rust-steps.yaml
    with:
      command: "fmt -- --check"
