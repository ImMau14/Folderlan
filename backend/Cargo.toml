[package]
name = "backend"
version = "1.0.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
actix-files = "0.6.6"
actix-service = "2.0.3"
actix-web = "4.11.0"
actix-web-httpauth = "0.8.2"
argon2 = "0.5.3"
chrono = "0.4.41"
futures-util = "0.3.31"
jsonwebtoken = "9.3.1"
mime_guess = "2.0.5"
once_cell = "1.21.3"
rand = "0.8.5"
regex = "1.11.1"
sanitize-filename = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tracing = "0.1.41"
tracing-actix-web = "0.7.19"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
notify = "8.2.0"

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["json", "multipart"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"