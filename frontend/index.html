<!doctype html>
<html lang="en" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f6" />
    <link
      rel="preload"
      href="fonts/Inter-Variable.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="fonts/Kanit-SemiBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin="anonymous"
    />
    <title>Folderlan</title>
  </head>
  <body class="h-full w-full">
    <!-- Inline script to set initial locale in localStorage and html lang before React mounts -->
    <script>
      ;(function () {
        try {
          var KEY = "folderlan:locale"
          var supported = ["en", "es", "it", "pt"]
          // Check existing preference
          var stored = localStorage.getItem(KEY)
          if (!stored) {
            // Detect browser language and store base code (es from es-ES)
            var code = (
              navigator.language ||
              (navigator.languages && navigator.languages[0]) ||
              ""
            ).split("-")[0]
            var chosen = supported.indexOf(code) !== -1 ? code : "en"
            localStorage.setItem(KEY, chosen)
            document.documentElement.lang = chosen
            // Expose for React if needed
            window.__INITIAL_LOCALE__ = chosen
          } else {
            document.documentElement.lang = stored
            window.__INITIAL_LOCALE__ = stored
          }
        } catch (e) {
          // Silent fail: leave fallback lang to React
        }
      })()
    </script>

    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
